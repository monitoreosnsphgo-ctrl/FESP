<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoreo de Supervisión de FESP - Hidalgo (FESP 2025)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
</head>
<body class="bg-slate-50 font-sans min-h-screen flex flex-col">

    <!-- Encabezado institucional -->
    <header class="bg-indigo-900 text-white shadow-md py-4 px-6">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide">Servicio Nacional de Salud Pública - Hidalgo</h1>
            <span class="text-sm bg-indigo-800 px-3 py-1 rounded-full mt-2 md:mt-0">Evaluación FESP 2025</span>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-4 gap-6">
        
        <!-- Panel lateral con la lista de distritos -->
        <aside class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 lg:col-span-1 flex flex-col h-[550px] lg:h-[720px]">
            <h2 class="font-bold text-slate-700 text-lg mb-3 pb-2 border-b">Listado de Distritos</h2>
            <div id="district-list" class="overflow-y-auto space-y-2 pr-1 flex-grow">
                <!-- Se llena dinámicamente con JavaScript -->
            </div>
        </aside>

        <!-- Contenedor del Mapa y Referencia de Semáforo -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 lg:col-span-3 flex flex-col h-[550px] lg:h-[720px]">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-3 gap-2">
                <h2 class="font-bold text-slate-700 text-lg">Mapa Interactivo y Semáforo</h2>
                <!-- Leyenda del Semáforo -->
                <div class="flex flex-wrap gap-2 text-xs font-semibold">
                    <span class="px-2 py-1 rounded bg-blue-500 text-white">&gt;80% Azul</span>
                    <span class="px-2 py-1 rounded bg-green-500 text-white">60-80% Verde</span>
                    <span class="px-2 py-1 rounded bg-yellow-400 text-slate-900">40-60% Amarillo</span>
                    <span class="px-2 py-1 rounded bg-orange-500 text-white">20-40% Naranja</span>
                    <span class="px-2 py-1 rounded bg-red-500 text-white">&lt;20% Rojo</span>
                </div>
            </div>
            <div id="map" class="w-full flex-grow rounded-lg z-10 border border-slate-100"></div>
        </section>

    </main>

    <!-- Pie de página -->
    <footer class="bg-white border-t border-slate-200 py-3 text-center text-xs text-slate-500">
        Realizado por Monitoreo y Alertamiento. Ronald Ramírez
    </footer>
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        // Datos completos de los distritos, cumplimiento y FESP basados en el documento proporcionado
        const distritosHidalgo = [
            {
                id: 1, name: "Distrito 01 Tula", coords: [20.05, -99.35], cumplimiento: 80.62, color: "#3b82f6", // Azul (>80%)
                fesp: { "1": "73.33%", "2": "96.67%", "3": "20%", "4": "75%", "5": "86.67%", "6": "100%", "7": "86.67%", "8": "95%", "9": "57.5%", "10": "100%", "11": "86.67%" }
            },
            {
                id: 2, name: "Distrito 02 Tulancingo", coords: [20.08, -98.36], cumplimiento: 32.22, color: "#f97316", // Naranja (20-40%)
                fesp: { "1": "40%", "2": "33.33%", "3": "20%", "4": "35%", "5": "50%", "6": "30%", "7": "26.67%", "8": "20%", "9": "27.5%", "10": "40%", "11": "20%" }
            },
            {
                id: 3, name: "Distrito 03 Pachuca", coords: [20.12, -98.73], cumplimiento: 50.55, color: "#facc15", // Amarillo (40-60%)
                fesp: { "1": "80%", "2": "80%", "3": "40%", "4": "45%", "5": "33.33%", "6": "100%", "7": "66.67%", "8": "40%", "9": "35%", "10": "20%", "11": "20%" }
            },
            {
                id: 4, name: "Distrito 04 Huejutla", coords: [21.14, -98.42], cumplimiento: 44.96, color: "#facc15", // Amarillo (40-60%)
                fesp: { "1": "60%", "2": "63.33%", "3": "20%", "4": "35%", "5": "43.33%", "6": "60%", "7": "40%", "8": "35%", "9": "35%", "10": "30%", "11": "73.33%" }
            },
            {
                id: 5, name: "Distrito 05 Mineral de la Reforma", coords: [20.07, -98.70], cumplimiento: 24.24, color: "#f97316", // Naranja (20-40%)
                fesp: { "1": "20%", "2": "43.33%", "3": "20%", "4": "25%", "5": "20%", "6": "30%", "7": "20%", "8": "20%", "9": "20%", "10": "20%", "11": "20%" }
            },
            {
                id: 6, name: "Distrito 06 Tizayuca", coords: [19.84, -98.98], cumplimiento: 56.07, color: "#facc15", // Amarillo (40-60%)
                fesp: { "1": "46.67%", "2": "90%", "3": "30%", "4": "45%", "5": "53.33%", "6": "70%", "7": "46.67%", "8": "60%", "9": "42.5%", "10": "70%", "11": "53.33%" }
            },
            {
                id: 7, name: "Distrito 07 Actopan", coords: [20.27, -98.93], cumplimiento: 26.56, color: "#f97316", // Naranja (20-40%)
                fesp: { "1": "26.67%", "2": "40%", "3": "20%", "4": "30%", "5": "23.33%", "6": "20%", "7": "33.33%", "8": "20%", "9": "20%", "10": "30%", "11": "26.67%" }
            },
            {
                id: 8, name: "Distrito 08 Ixmiquilpan", coords: [20.48, -99.21], cumplimiento: 56.72, color: "#facc15", // Amarillo (40-60%)
                fesp: { "1": "60%", "2": "66.67%", "3": "20%", "4": "75%", "5": "66.67%", "6": "50%", "7": "26.67%", "8": "60%", "9": "40%", "10": "60%", "11": "86.67%" }
            },
            {
                id: 9, name: "Distrito 09 Zacualtipán", coords: [20.64, -98.65], cumplimiento: 35.42, color: "#f97316", // Naranja (20-40%)
                fesp: { "1": "26.67%", "2": "63.33%", "3": "20%", "4": "35%", "5": "33.33%", "6": "80%", "7": "20%", "8": "40%", "9": "20%", "10": "20%", "11": "20%" }
            },
            {
                id: 10, name: "Distrito 10 Apan", coords: [19.72, -98.44], cumplimiento: 47.01, color: "#facc15", // Amarillo (40-60%)
                fesp: { "1": "40%", "2": "66.67%", "3": "20%", "4": "55%", "5": "50%", "6": "60%", "7": "33.33%", "8": "50%", "9": "35%", "10": "30%", "11": "53.33%" }
            },
            {
                id: 11, name: "Distrito 11 Huichapan", coords: [20.36, -99.65], cumplimiento: 78.94, color: "#22c55e", // Verde (60-80%)
                fesp: { "1": "86.67%", "2": "100%", "3": "30%", "4": "80%", "5": "80%", "6": "60%", "7": "46.67%", "8": "80%", "9": "85%", "10": "100%", "11": "86.67%" }
            },
            {
                id: 12, name: "Distrito 12 Jacala", coords: [21.00, -99.19], cumplimiento: 27.58, color: "#f97316", // Naranja (20-40%)
                fesp: { "1": "33.33%", "2": "43.33%", "3": "20%", "4": "25%", "5": "20%", "6": "20%", "7": "33.33%", "8": "30%", "9": "22.5%", "10": "20%", "11": "26.67%" }
            }
        ];

        // Inicializar el mapa centrado en Hidalgo
        const map = L.map('map').setView([20.45, -98.95], 8);

        // Capa base de OpenStreetMap (Libre)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 19,
            minZoom: 7
        }).addTo(map);

        const listContainer = document.getElementById('district-list');

        // Renderizar marcadores y lista lateral
        distritosHidalgo.forEach(distrito => {
            const circleMarker = L.circleMarker(distrito.coords, {
                radius: 22,
                fillColor: distrito.color,
                color: '#334155',
                weight: 1.5,
                opacity: 1,
                fillOpacity: 0.9
            }).addTo(map);

            // Estructura detallada del cuadro de texto con las FESP
            const popupContent = `
                <div class="p-2 max-w-sm max-h-[350px] overflow-y-auto">
                    <h3 class="font-bold text-base text-indigo-900 border-b pb-1 mb-1">${distrito.name}</h3>
                    <div class="mb-2 bg-slate-100 p-2 rounded text-xs">
                        <span class="font-bold text-slate-700">Cumplimiento General 2025:</span> 
                        <span class="font-extrabold text-indigo-700">${distrito.cumplimiento}%</span>
                    </div>
                    <h4 class="font-bold text-xs text-slate-600 mb-1 uppercase tracking-wider">Desglose FESP[cite: 2]:</h4>
                    <ul class="space-y-1 text-xs text-slate-600">
                        <li><strong>FESP 1 (Monitoreo):</strong> ${distrito.fesp["1"]}</li>
                        <li><strong>FESP 2 (Vigilancia/Riesgos):</strong> ${distrito.fesp["2"]}</li>
                        <li><strong>FESP 3 (Investigación):</strong> ${distrito.fesp["3"]}</li>
                        <li><strong>FESP 4 (Políticas/Marcos):</strong> ${distrito.fesp["4"]}</li>
                        <li><strong>FESP 5 (Participación Social):</strong> ${distrito.fesp["5"]}</li>
                        <li><strong>FESP 6 (Recursos Humanos):</strong> ${distrito.fesp["6"]}</li>
                        <li><strong>FESP 7 (Medicamentos/Tecnología):</strong> ${distrito.fesp["7"]}</li>
                        <li><strong>FESP 8 (Financiamiento):</strong> ${distrito.fesp["8"]}</li>
                        <li><strong>FESP 9 (Acceso a Servicios):</strong> ${distrito.fesp["9"]}</li>
                        <li><strong>FESP 10 (Promoción de la Salud):</strong> ${distrito.fesp["10"]}</li>
                        <li><strong>FESP 11 (Determinantes Sociales):</strong> ${distrito.fesp["11"]}</li>
                    </ul>
                </div>
            `;

            circleMarker.bindPopup(popupContent);

            // Elemento de la lista lateral
            const item = document.createElement('div');
            item.className = "flex items-center justify-between p-2 rounded-lg hover:bg-slate-100 cursor-pointer transition text-sm border border-transparent hover:border-slate-200";
            item.innerHTML = `
                <div class="flex items-center">
                    <span class="w-4 h-4 rounded-full mr-3 shrink-0 shadow-sm border border-slate-300" style="background-color: ${distrito.color};"></span>
                    <span class="font-medium text-slate-700">${distrito.name}</span>
                </div>
                <span class="text-xs font-bold text-slate-500 bg-slate-100 px-2 py-0.5 rounded">${distrito.cumplimiento}%</span>
            `;

            // Evento para hacer zoom y abrir la tarjeta
            item.addEventListener('click', () => {
                map.setView(distrito.coords, 10);
                circleMarker.openPopup();
            });

            listContainer.appendChild(item);
        });
    </script>
</body>
</html>
